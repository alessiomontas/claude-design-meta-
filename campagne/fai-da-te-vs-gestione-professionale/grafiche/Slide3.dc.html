<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</helmet>
<div class="frame" style="width: 1080px; height: 1350px; box-sizing: border-box; background: #3F3A33; color: #F5F0E6; display: flex; flex-direction: column; padding: 78px 86px 70px 86px; position: relative; overflow: hidden;">

  <div style="position: absolute; right: -60px; bottom: -40px; width: 620px; display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; opacity: 0.09; z-index: 0;">
    <div style="aspect-ratio: 1; border: 2px solid #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; border: 2px solid #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; border: 2px solid #C8A24B; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; border: 2px solid #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; border: 2px solid #C8A24B; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; border: 2px solid #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; background: #F5F0E6; border-radius: 8px;"></div>
    <div style="aspect-ratio: 1; border: 2px solid #F5F0E6; border-radius: 8px;"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 32px; height: 3px; background: #C8A24B;"></div>
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 24px; text-transform: uppercase;">Hadrianus</span>
    </div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 2px; color: #9a8f7c; text-transform: uppercase;">Voce 03 / 05</span>
  </div>

  <div style="border-top: 2px dashed rgba(200,162,75,0.4); margin-top: 30px; position: relative; z-index: 1;"></div>

  <div style="flex: 1; display: flex; align-items: center; position: relative; z-index: 1;">
    <div style="display: flex; gap: 40px; align-items: stretch;">
      <div style="width: 4px; background: #C8A24B; border-radius: 2px; flex-shrink: 0;"></div>
      <div style="display: flex; flex-direction: column; gap: 30px; justify-content: center;">
        <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 88px; line-height: 1.08; margin: 0; letter-spacing: -1px; max-width: 820px;">Non è il tempo che ti manca. <span style="color: #C8A24B;">È il margine che non vedi.</span></h1>
        <p style="font-size: 40px; line-height: 1.35; margin: 0; color: #d8d2c4; max-width: 780px;">Notti vendute al prezzo sbagliato. Un calendario con buchi che non sai spiegarti.</p>
      </div>
    </div>
  </div>

  <div style="border-top: 2px dashed rgba(200,162,75,0.4); margin-bottom: 26px; position: relative; z-index: 1;"></div>

  <div style="display: flex; justify-content: flex-end; position: relative; z-index: 1;">
    <div style="display: flex; align-items: center; gap: 14px; background: rgba(200,162,75,0.16); border: 2px solid #C8A24B; border-radius: 999px; padding: 18px 32px;">
      <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 32px;">Scorri</span>
      <span style="font-size: 34px; color: #C8A24B;">→</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
