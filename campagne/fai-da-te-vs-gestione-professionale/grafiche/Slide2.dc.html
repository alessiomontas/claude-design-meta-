<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</helmet>
<div class="frame" style="width: 1080px; height: 1350px; box-sizing: border-box; background: #3F3A33; color: #F5F0E6; display: flex; flex-direction: column; padding: 78px 86px 70px 86px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 32px; height: 3px; background: #C8A24B;"></div>
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 24px; text-transform: uppercase;">Hadrianus</span>
    </div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 2px; color: #9a8f7c; text-transform: uppercase;">Voce 02 / 05</span>
  </div>

  <div style="border-top: 2px dashed rgba(200,162,75,0.4); margin-top: 30px;"></div>

  <div style="flex: 1; display: flex; align-items: center;">
    <div style="display: flex; gap: 40px; align-items: stretch; width: 100%;">
      <div style="width: 4px; background: #C8A24B; border-radius: 2px; flex-shrink: 0;"></div>
      <div style="display: flex; flex-direction: column; gap: 40px; justify-content: center; width: 100%;">

        <div style="display: flex; align-items: center; gap: 28px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/><path d="M4 7l-2 1M4 15l-2-1M20 7l2 1M20 15l2-1"/></svg>
          <span style="font-size: 44px; font-weight: 700; line-height: 1.2;">Il telefono che vibra a cena.</span>
          <div style="flex: 1; border-bottom: 2px dotted rgba(245,240,230,0.3); margin: 0 6px;"></div>
        </div>

        <div style="display: flex; align-items: center; gap: 28px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M19 5L9 15"/><path d="M11 7l6 6"/><path d="M6 20l3-8 5 5-8 3z"/></svg>
          <span style="font-size: 44px; font-weight: 700; line-height: 1.2;">Le pulizie da incastrare tra un ospite e l'altro.</span>
          <div style="flex: 1; border-bottom: 2px dotted rgba(245,240,230,0.3); margin: 0 6px;"></div>
        </div>

        <div style="display: flex; align-items: center; gap: 28px;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 11.5V4a1 1 0 0 1 1-1h7.5L21 12.5l-8.5 8.5L3 11.5z"/><circle cx="7.5" cy="7.5" r="1.4" fill="#C8A24B" stroke="none"/></svg>
          <span style="font-size: 44px; font-weight: 700; line-height: 1.2;">Il prezzo lasciato uguale, perché non c'è tempo di cambiarlo.</span>
          <div style="flex: 1; border-bottom: 2px dotted rgba(245,240,230,0.3); margin: 0 6px;"></div>
        </div>

      </div>
    </div>
  </div>

  <div style="border-top: 2px dashed rgba(200,162,75,0.4); margin-bottom: 26px;"></div>

  <div style="display: flex; justify-content: flex-end;">
    <div style="display: flex; align-items: center; gap: 14px; background: rgba(200,162,75,0.16); border: 2px solid #C8A24B; border-radius: 999px; padding: 18px 32px;">
      <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 32px;">Scorri</span>
      <span style="font-size: 34px; color: #C8A24B;">→</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
