<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</helmet>
<div class="frame" style="width: 1080px; height: 1350px; box-sizing: border-box; background: radial-gradient(120% 90% at 50% 8%, #4a443a 0%, #3F3A33 58%, #2E2A25 100%); color: #F5F0E6; display: flex; flex-direction: column; padding: 78px 86px 70px 86px;">

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 32px; height: 3px; background: #C8A24B;"></div>
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 24px; text-transform: uppercase;">Hadrianus</span>
    </div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 2px; color: #9a8f7c; text-transform: uppercase;">Voce 01 / 05</span>
  </div>

  <div style="border-top: 2px dashed rgba(200,162,75,0.4); margin-top: 30px;"></div>

  <div style="flex: 1; display: flex; align-items: center;">
    <div style="display: flex; gap: 40px; align-items: stretch;">
      <div style="width: 4px; background: #C8A24B; border-radius: 2px; flex-shrink: 0;"></div>
      <div style="display: flex; flex-direction: column; gap: 30px; justify-content: center;">
        <span style="font-size: 30px; font-weight: 700; color: #9A8A63; text-transform: uppercase; letter-spacing: 3px;">Il conto che non hai mai fatto</span>
        <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 92px; line-height: 1.06; margin: 0; letter-spacing: -1px; max-width: 880px;">Il 15% che <span style="color: #C8A24B;">"risparmi"</span> facendo tutto da solo, lo stai pagando lo stesso.</h1>
        <p style="font-size: 40px; line-height: 1.35; margin: 0; color: #d8d2c4;">Solo che lo paghi in tempo, non in euro.</p>
      </div>
    </div>
  </div>

  <div style="border-top: 2px dashed rgba(200,162,75,0.4); margin-bottom: 26px;"></div>

  <div style="display: flex; justify-content: flex-end;">
    <div style="display: flex; align-items: center; gap: 14px; background: rgba(200,162,75,0.16); border: 2px solid #C8A24B; border-radius: 999px; padding: 18px 32px;">
      <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 32px;">Scorri</span>
      <span style="font-size: 34px; color: #C8A24B;">→</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
