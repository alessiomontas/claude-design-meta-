<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</head>
<body>
<div class="frame" style="width: 1080px; height: 1350px; box-sizing: border-box; background: radial-gradient(120% 90% at 50% 12%, #4a443a 0%, #3F3A33 60%, #2E2A25 100%); color: #F5F0E6; display: flex; flex-direction: column; justify-content: space-between; padding: 90px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="width: 40px; height: 3px; background: #C8A24B;"></div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 6px; font-size: 28px; text-transform: uppercase;">Hadrianus</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 30px;">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 30px; color: #C8A24B; letter-spacing: 3px; text-transform: uppercase;">Domanda</span>
      <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 84px; line-height: 1.0; margin: 0; letter-spacing: -1px;">E se qualcosa va storto?</h1>
    </div>
    <div style="background: rgba(245,240,230,0.06); border-left: 6px solid #C8A24B; border-radius: 14px; padding: 40px 44px;">
      <p style="font-size: 46px; line-height: 1.25; margin: 0; font-weight: 700;">Ci pensiamo noi. Assistenza H24 per te e per gli ospiti: tu non gestisci nessuna emergenza.</p>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="width: 100%; text-align: center; background: #C8A24B; color: #2E2A25; border-radius: 999px; padding: 32px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 44px;">Hai un'altra domanda? Scrivi "INFO"</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 34px; color: #b7ad9a;">05 / 05</span>
      <span style="font-size: 34px; color: #d8d2c4;">Ti rispondiamo noi →</span>
    </div>
  </div>
</div>
</body>
</html>
