<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</head>
<body>
<div class="frame" style="width: 1080px; height: 1920px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 15%, #4a443a 0%, #3F3A33 60%, #2E2A25 100%); color: #F5F0E6; display: flex; flex-direction: column; justify-content: space-between; padding: 240px 90px 280px 90px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="width: 40px; height: 3px; background: #C8A24B;"></div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 6px; font-size: 30px; text-transform: uppercase;">Hadrianus</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 40px;">
    <div style="width: 108px; height: 108px; border-radius: 26px; background: rgba(200,162,75,0.16); border: 2px solid #C8A24B; display: flex; align-items: center; justify-content: center;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C8A24B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>
    </div>
    <h1 style="font-family: 'Archivo', sans-serif; font-weight: 800; font-style: italic; font-size: 88px; line-height: 1.05; margin: 0; letter-spacing: -1px; color: #e8e2d4;">"E se un giorno voglio riprendermi la casa?"</h1>
    <div style="background: rgba(245,240,230,0.06); border-left: 6px solid #C8A24B; border-radius: 14px; padding: 44px 48px; display: flex; flex-direction: column; gap: 16px;">
      <p style="font-size: 54px; line-height: 1.1; margin: 0; font-weight: 800; color: #F5F0E6;">Quando vuoi.</p>
      <p style="font-size: 42px; line-height: 1.3; margin: 0; color: #d8d2c4;">Nessun vincolo di anni. La casa resta tua: tu decidi, noi gestiamo.</p>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
    <div style="width: 100%; text-align: center; background: #C8A24B; color: #2E2A25; border-radius: 999px; padding: 34px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 46px;">Scrivi "CALCOLO" in DM</div>
    <span style="font-size: 36px; color: #d8d2c4;">Parliamone, senza impegno</span>
  </div>
</div>
</body>
</html>
