<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</head>
<body>
<div class="frame" style="width: 1080px; height: 1920px; box-sizing: border-box; background: #F5F0E6; color: #26241F; display: flex; flex-direction: column; justify-content: space-between; padding: 240px 90px 280px 90px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="width: 40px; height: 3px; background: #C8A24B;"></div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 6px; font-size: 30px; text-transform: uppercase; color: #3F3A33;">Hadrianus</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 44px;">
    <span style="font-size: 38px; font-weight: 600; color: #9A8A63; text-transform: uppercase; letter-spacing: 3px;">Trasparenza totale</span>
    <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 118px; line-height: 0.98; margin: 0; letter-spacing: -1px; color: #3F3A33;">Zero costi nascosti. <span style="color: #b3892f;">Davvero.</span></h1>
    <div style="background: #3F3A33; color: #F5F0E6; border-radius: 24px; padding: 48px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; align-items: baseline; gap: 22px;">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 100px; color: #C8A24B; line-height: 1;">15%</span>
        <span style="font-size: 42px; line-height: 1.2;">sul fatturato, e lo paghi solo quando guadagni</span>
      </div>
      <div style="height: 1px; background: rgba(245,240,230,0.15);"></div>
      <p style="font-size: 40px; line-height: 1.3; margin: 0; color: #d8d2c4;">Rendiconti chiari, tutto tracciato. Nessuna sorpresa a fine mese.</p>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
    <div style="width: 100%; text-align: center; background: #3F3A33; color: #F5F0E6; border-radius: 999px; padding: 34px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 46px;">Scrivi "CALCOLO" in DM</div>
    <span style="font-size: 36px; color: #6f695c;">Ti mostriamo i numeri, senza impegno</span>
  </div>
</div>
</body>
</html>
