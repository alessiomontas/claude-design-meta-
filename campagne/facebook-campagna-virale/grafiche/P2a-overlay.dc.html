<!doctype html>
<html>

<x-dc>
<helmet>

<div class="frame" style="width: 1080px; height: 1920px; box-sizing: border-box; position: relative; overflow: hidden; background: transparent;">

    rgba(46,42,37,0.76) 20%,
    rgba(46,42,37,0.70) 40%,
    rgba(46,42,37,0.88) 64%,

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 36px; height: 3px; background: #C8A24B;"></div>
        <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 26px; text-transform: uppercase; color: #F5F0E6;">Hadrianus</span>
      </div>
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 6px; font-size: 22px; text-transform: uppercase; color: #C8A24B;">Gli errori</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: flex-end; gap: 28px;">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 400px; line-height: 0.76; letter-spacing: -16px; color: #C8A24B;">6</span>

      </div>

      <p style="font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 38px; line-height: 1.3; margin: 18px 0 0 0; color: #e6e0d2;">Sistemabili tutti. Anche senza di noi.</p>
    </div>

    <div style="display: flex; align-items: center; gap: 18px;">
      <div style="width: 14px; height: 14px; background: #C8A24B;"></div>
      <span style="font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 28px; color: #cfc7b8;">Il primo &egrave; la foto di copertina.</span>
    </div>

  </div>
