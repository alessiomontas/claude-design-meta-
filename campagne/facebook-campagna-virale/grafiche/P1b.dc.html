<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</helmet>

<div class="frame" style="width: 1080px; height: 1080px; box-sizing: border-box;  background: #3F3A33; overflow: hidden;">
  <div style="width: 1080px; height: 1080px; box-sizing: border-box; padding: 44px 52px 0 52px; display: flex; flex-direction: column; justify-content: space-between; background: #3F3A33;">
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 36px; height: 3px; background: #C8A24B;"></div>
        <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 26px; text-transform: uppercase; color: #F5F0E6;">Hadrianus</span>
      </div>
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 6px; font-size: 22px; text-transform: uppercase; color: #9A8A63;">La stima</span>
    </div>
      <h2 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 46px; line-height: 1.1; margin: 0; letter-spacing: -1.5px; color: #F5F0E6; text-wrap: pretty;">Scrivi questo in commento.</h2>
    </div>

    <div style="flex: 1; display: flex; gap: 26px; padding: 20px 0 20px 0; align-items: center;">
      <div style="width: 3px; background: #C8A24B; flex-shrink: 0; align-self: stretch; min-height: 100%;"></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 26px;">
        <div style="display: flex; align-items: flex-start; gap: 20px;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #C8A24B; border: 3px solid #C8A24B; flex-shrink: 0;"></div>
          <div style="display: flex; flex-direction: column; gap: 6px; margin-top: -4px;">
            <span style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.16; color: #F5F0E6;">La zona</span>
            <span style="font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.26; color: #C8A24B;">basta il quartiere</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 20px;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #C8A24B; border: 3px solid #C8A24B; flex-shrink: 0;"></div>
          <div style="display: flex; flex-direction: column; gap: 6px; margin-top: -4px;">
            <span style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.16; color: #F5F0E6;">Bilocale, trilocale, quanti posti letto</span>
            
          </div>
        </div>
        <div style="display: flex; align-items: flex-start; gap: 20px;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #C8A24B; border: 3px solid #C8A24B; flex-shrink: 0;"></div>
          <div style="display: flex; flex-direction: column; gap: 6px; margin-top: -4px;">
            <span style="font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.16; color: #F5F0E6;">Se &egrave; gi&agrave; arredato</span>
            
          </div>
        </div>
      </div>
    </div>

    <div style="flex-shrink: 0; box-sizing: border-box; background: #C8A24B; color: #2E2A25; margin: 0 -52px; padding: 24px 52px 26px 52px; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 32px; line-height: 1.14; letter-spacing: -0.5px;">Ti rispondiamo con una forchetta.</span>
      <span style="font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2; color: #4a3c17;">In pubblico, sotto il tuo commento.</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
