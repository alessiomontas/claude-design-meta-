<!doctype html>
<html>
<head>

  <style>

<body>
<div class="frame" style="width: 1080px; height: 1920px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 12%, #4a443a 0%, #3F3A33 55%, #2E2A25 100%); color: #F5F0E6; display: flex; flex-direction: column; justify-content: space-between; padding: 240px 90px 280px 90px;">

  </div>
  <div style="display: flex; flex-direction: column; gap: 44px;">
    <span style="font-size: 36px; font-weight: 600; color: #9A8A63; text-transform: uppercase; letter-spacing: 3px;">Case vacanza · Roma · Ostia</span>
    <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 112px; line-height: 1.0; margin: 0; letter-spacing: -1px;">Il tuo affitto breve è un <span style="color: #C8A24B;">secondo lavoro.</span></h1>
    <div style="background: rgba(245,240,230,0.06); border-left: 6px solid #C8A24B; border-radius: 14px; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px;">

    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div style="width: 100%; text-align: center; background: #C8A24B; color: #2E2A25; border-radius: 999px; padding: 34px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 46px;">Scrivi "CALCOLO" in DM</div>
    <span style="font-size: 38px; color: #d8d2c4;">Simulazione gratuita sul tuo immobile</span>
  </div>
</div>
