<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</head>
<body>
<div class="frame" style="width: 1080px; height: 1080px; box-sizing: border-box; background: radial-gradient(120% 100% at 50% 0%, #4a443a 0%, #3F3A33 55%, #2E2A25 100%); color: #F5F0E6; display: flex; flex-direction: column; justify-content: space-between; padding: 84px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <div style="width: 34px; height: 3px; background: #C8A24B;"></div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 24px; text-transform: uppercase;">Hadrianus</span>
  </div>
  <div style="display: flex; align-items: center; gap: 40px;">
    <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 200px; line-height: 0.85; color: #C8A24B; letter-spacing: -4px;">15%</span>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 46px; font-weight: 800; line-height: 1.1;">Guadagniamo solo se guadagni tu.</span>
      <span style="font-size: 34px; color: #d8d2c4;">Commissione sul fatturato. Nient'altro.</span>
    </div>
  </div>
  <p style="font-size: 40px; line-height: 1.3; margin: 0; color: #d8d2c4;">Pensiamo a tutto noi. Tu ricevi la tua rendita, senza pensieri.</p>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="width: 100%; box-sizing: border-box; text-align: center; background: #C8A24B; color: #2E2A25; border-radius: 999px; padding: 30px; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 46px;">Scrivi "INFO" in privato</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 30px; color: #b7ad9a;">03 / 03</span>
      <span style="font-size: 32px; color: #d8d2c4;">Simulazione gratuita, senza impegno</span>
    </div>
  </div>
</div>
</body>
</html>
