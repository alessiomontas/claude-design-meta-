<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</head>
<body>
<div class="frame" style="width: 1080px; height: 1350px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 8%, #4a443a 0%, #3F3A33 55%, #2E2A25 100%); color: #F5F0E6; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 90px;">
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="width: 40px; height: 3px; background: #C8A24B;"></div>
    <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 6px; font-size: 28px; text-transform: uppercase;">Hadrianus</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 40px;">
    <span style="font-size: 36px; font-weight: 600; color: #9A8A63; text-transform: uppercase; letter-spacing: 3px;">Hai una casa a [Zona]?</span>
    <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 104px; line-height: 1.0; margin: 0; letter-spacing: -1px;">E se l'inquilino <span style="color: #C8A24B;">non paga</span>… e non se ne va?</h1>
    <div style="background: rgba(245,240,230,0.06); border-left: 6px solid #C8A24B; border-radius: 14px; padding: 36px 40px;">
      <p style="font-size: 42px; line-height: 1.3; margin: 0; color: #d8d2c4;">Tenerla sfitta è un costo. Affittarla a lungo termine fa paura: morosità, danni, mesi per rientrare in possesso.</p>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 34px; color: #b7ad9a;">01 / 03</span>
    <div style="display: flex; align-items: center; gap: 16px; background: rgba(200,162,75,0.16); border: 2px solid #C8A24B; border-radius: 999px; padding: 18px 32px;">
      <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 32px;">C'è una terza strada</span>
      <span style="font-size: 34px; color: #C8A24B;">→</span>
    </div>
  </div>
</div>
</body>
</html>
