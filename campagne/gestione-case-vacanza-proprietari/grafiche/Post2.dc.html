<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
    a { color: #C8A24B; } a:hover { color: #a8863b; }
  </style>
</helmet>
<div style="width: 1080px; height: 1080px; box-sizing: border-box; background: #0E2A47; display: grid; grid-template-columns: 1fr 1fr;">
  <!-- Placeholder foto: sostituire con foto editoriale reale Rome Smart Sea -->
  <div style="position: relative; background: repeating-linear-gradient(45deg, #143459 0 40px, #123152 40px 80px); display: flex; align-items: center; justify-content: center;">
    <span style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 26px; color: rgba(245,240,230,0.35); letter-spacing: 2px; text-align: center; padding: 0 24px;">[ FOTO REALE<br>Rome Smart Sea ]</span>
    <div style="position: absolute; bottom: 44px; left: 44px; background: #5B8C8A; color: #06231f; font-size: 26px; font-weight: 700; padding: 12px 22px; border-radius: 10px; letter-spacing: 1px;">OSTIA</div>
  </div>
  <div style="box-sizing: border-box; padding: 72px 64px; display: flex; flex-direction: column; justify-content: center; gap: 34px; color: #F5F0E6;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 34px; height: 3px; background: #C8A24B;"></div>
      <span style="font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 5px; font-size: 24px; text-transform: uppercase;">Hadrianus</span>
    </div>
    <h1 style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 70px; line-height: 1.0; margin: 0; letter-spacing: -1px;">Caso reale,<br>numeri reali.</h1>
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid rgba(200,162,75,0.3); padding-bottom: 16px;">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 68px; color: #C8A24B; line-height: 1;">~183€</span>
        <span style="font-size: 30px; color: #cdd7e2;">ADR a notte</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid rgba(200,162,75,0.3); padding-bottom: 16px;">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 68px; color: #C8A24B; line-height: 1;">5.0 ★</span>
        <span style="font-size: 30px; color: #cdd7e2;">valutazione media</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 18px;">
        <span style="font-family: 'Archivo', sans-serif; font-weight: 900; font-size: 56px; color: #C8A24B; line-height: 1;">Superhost</span>
        <span style="font-size: 30px; color: #cdd7e2;">badge</span>
      </div>
    </div>
    <p style="font-size: 34px; line-height: 1.3; margin: 0; color: #cdd7e2;">Non fortuna. <strong style="color: #F5F0E6;">Metodo alberghiero.</strong></p>
  </div>
</div>
